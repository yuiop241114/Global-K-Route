spring.application.name=kroute
spring.profiles.default=local

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.tour-api.base-url=${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011}
app.tour-api.service-key=${TOUR_API_KEY:}
app.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
app.upstash.redis.rest-url=${REDIS_REST_URL:}
app.upstash.redis.rest-token=${REDIS_REST_TOKEN:}
app.auth.secure-cookie=${AUTH_SECURE_COOKIE:true}
app.auth.session-days=${AUTH_SESSION_DAYS:7}
app.auth.password-reset-minutes=${PASSWORD_RESET_MINUTES:30}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.mail.from-email=${MAIL_FROM_EMAIL:${MAIL_USERNAME:}}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
