spring.application.name=kroute
spring.profiles.default=local

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.tour-api.base-url=${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011}
app.tour-api.service-key=${TOUR_API_KEY:}
app.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
app.upstash.redis.rest-url=${REDIS_REST_URL:}
app.upstash.redis.rest-token=${REDIS_REST_TOKEN:}
app.auth.secure-cookie=${AUTH_SECURE_COOKIE:true}
app.auth.session-days=${AUTH_SESSION_DAYS:7}
app.auth.password-reset-minutes=${PASSWORD_RESET_MINUTES:30}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.mailjet.base-url=${MAILJET_BASE_URL:https://api.mailjet.com/v3.1}
app.mailjet.api-key=${MAILJET_API_KEY:}
app.mailjet.secret-key=${MAILJET_SECRET_KEY:}
app.mailjet.from-email=${MAILJET_FROM_EMAIL:}
app.mailjet.from-name=${MAILJET_FROM_NAME:Global K-Route}
